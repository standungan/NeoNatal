# Backend + dashboard + Postgres on one VPS, over plain HTTP.
#
#   cp .env.example .env     # set VPS_IP and SECRET_KEY
#   docker compose up -d --build
#
#   Dashboard   http://<vps-ip>
#   API docs    http://<vps-ip>:8000/docs
#
# No nginx and no TLS here on purpose — this is the shortest path to something
# you can open from home. For HTTPS on a real domain, add docker-compose.tls.yml
# (see DEPLOYMENT.md → "Adding HTTPS later").

name: neonatal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs everything in this directory in filename order, exactly
      # once — on first boot, while the data volume is still empty. This is
      # where the schema and the demo data actually come from, because the
      # Alembic chain cannot build a database from scratch (see backend.command).
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # -h forces a TCP check. Without it pg_isready uses the unix socket, which
      # already answers during the init-script phase — the backend would then
      # start against a half-built schema. The real server only opens TCP once
      # those scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      # Generous: the first boot has to create the schema and load ~4 days of
      # seed records before it will answer.
      retries: 24

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # config.py rewrites postgresql:// → +asyncpg on its own; explicit anyway.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "false"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: ./uploads          # relative to the image's WORKDIR (/app)
      # Only matters for browsers/Flutter hitting :8000 directly. The dashboard
      # reaches the API server-side over the compose network, so it never
      # triggers CORS at all.
      ALLOWED_ORIGINS: http://${VPS_IP},http://${VPS_IP}:${API_PORT:-8000}
    volumes:
      # Named volume — uploaded photos survive `up --build`.
      - uploads:/app/uploads
    # Overrides the image's CMD, which runs a bare `alembic upgrade head`. That
    # cannot work on a fresh database: revision a7821a4243e6 ("initial schema")
    # was autogenerated against an already-populated DB, so it consists only of
    # DROP INDEX statements — there is no CREATE TABLE for the ten core tables
    # anywhere in the chain, and the first statement fails on an empty DB.
    # database/schema.sql is the real source of truth and the db container loads
    # it on first boot, so all that remains here is to record where that schema
    # sits in the chain; genuine migrations added later still apply normally.
    command:
      - sh
      - -c
      - |
        if [ -z "$$(alembic current 2>/dev/null)" ]; then
          echo "no alembic_version -> schema came from schema.sql; stamping head"
          alembic stamp head
        fi
        alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # The dashboard does NOT need this. It is published so you can reach
      # /health and /docs while bringing the box up. Close it once you're done
      # testing (see DEPLOYMENT.md → Security).
      - "${API_PORT:-8000}:8000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Server-side only (lib/config.ts). Container DNS — this never reaches the
      # browser, which is the whole point of the BFF.
      API_BASE_URL: http://backend:8000
      # MUST stay false on plain HTTP. A `secure` cookie is discarded by the
      # browser over http://, so login would look like it worked and then bounce
      # you straight back to /login.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-80}:3000"

volumes:
  pgdata:
  uploads:
