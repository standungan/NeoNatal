org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation fails here when closing its .tab caches, which
# aborts :image_picker_android: and :url_launcher_android: compileReleaseKotlin.
# It reproduces after a full `flutter clean`, so it is not stale state, and the
# machine has ample RAM and disk - it is the incremental compiler itself.
# Release builds are full compiles anyway, so the incremental caches buy nothing
# here and cost the build.
kotlin.incremental=false
